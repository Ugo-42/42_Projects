<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Error 400</title>
<link rel="stylesheet" href="/website/css/style.css">
<style>
body.error-page {
    background: linear-gradient(
        135deg,
        rgb(55, 0, 0),
        rgb(132, 0, 0),
        rgb(255, 224, 71),
        rgb(132, 0, 0),
        rgb(55, 0, 0)
    );
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 100px;
}
.error-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    flex: 1;
}
.error-code {
    font-size: clamp(120px, 18vw, 220px);
    font-weight: bold;
    color: #842548;
    margin: 0;
    line-height: 1;
    letter-spacing: 6px;
}
.error-text {
    font-size: clamp(22px, 4vw, 48px);
    color: #3a2e2e;
    margin: 0;
}
.error-gif {
    margin-top: 30px;
    max-width: 300px;
}
</style>
</head>
<body class="error-page">
<div class="square">
    <div class="error-container">
        <h1 class="error-code">400</h1>
        <p class="error-text">Bad Request</p>
    </div>
</div>
<img
class="error-gif"
src="https://http.cat/images/400.jpg"
alt="HTTP 400 - Bad Request"
>
</body>
</html>
