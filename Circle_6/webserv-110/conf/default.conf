# ===== SERVER 1 =====
server {
    listen 127.0.0.1:8080;        # Single interface:port
    server_name localhost;        # Optional virtual host name

    root /;                       # Default root for this server
    client_max_body_size 1G;      # Max allowed body size

    # Default error pages
    error_page 404 /website/errors/404.html;
    error_page 500 /website/errors/500.html;
    error_page 403 /website/errors/403.html;

    # ===== ROUTE 1: Static files =====
    location / {
        methods GET POST HEAD;
        root /;
        index index.html;
        autoindex off;             # Directory listing
    }

    # ===== ROUTE 2: Uploads =====
    location /upload {
        methods GET POST DELETE;
        root /uploads;
        upload_enable on;
    }


    # ===== ROUTE 3: Redirect =====
    location /shrek {
        methods GET;
        return 302 /website;
    }

    location /rick {
        methods GET;
        return 301 https://www.youtube.com/watch?v=dQw4w9WgXcQ;
    }

    # ===== ROUTE 4: CGI execution =====
    location /cgi-bin {
        methods GET POST;
        cgi .sh /bin/bash;
        cgi .py /usr/bin/python3;
        cgi .pl /usr/bin/perl;
        root /cgi-bin;
        autoindex on;
    }

    # ===== ROUTE 5: webserv tester =====
    location /website {
        methods GET POST DELETE HEAD;
        root /website;
        index index.html;
        autoindex off;
        upload_enable on;
    }

}


# ===== SERVER 2 =====
server {
    listen 127.0.0.1:8085;       # Another port
    server_name test.local;

    root /;
    client_max_body_size 1024M;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        methods GET POST HEAD;
        root /;
        index index.html;
        autoindex off;             # Directory listing
    }
}
